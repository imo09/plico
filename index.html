:root {
  --fondo: #E9EDEC; --piano: #DDE3E2; --carta: #F9FBFA; --rialzo: #FFFFFF;
  --testo: #0E1D2A; --testo-2: #5A6670; --linea: #CAD2D2;
  --accento: #C99A4E; --accento-tenue: #F0E4CE; --su-accento: #0E1D2A;
  --ok: #2F9184; --no: #B4544A;
  --ombra: 0 6px 24px rgba(14, 29, 42, .12), 0 1px 3px rgba(14, 29, 42, .10);
  --sopra: #EEF1F0; --linea-tenue: #E1E6E5; --no-testo: #8A3A31;
  --f-ui: "Space Grotesk", system-ui, sans-serif; --f-mono: "Space Mono", ui-monospace, monospace; --f-nome: "Poppins", "Space Grotesk", sans-serif;
  --area-giu: env(safe-area-inset-bottom, 0px); --area-su: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="chiaro"]) {
    --fondo: #0A1620; --piano: #07111A; --carta: #0E1D2A; --rialzo: #13263A;
    --testo: #E9EDEC; --testo-2: #93A1AB; --linea: #29405A;
    --accento: #E8A867; --accento-tenue: #3A3226; --su-accento: #0E1D2A;
    --ok: #4FB3A5; --no: #D47A70;
    --ombra: 0 6px 24px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .40);
    --sopra: #1A3048; --linea-tenue: #1D3248; --no-testo: #E39A90;
    color-scheme: dark;
  }
}
:root[data-tema="scuro"] {
  --fondo: #0A1620; --piano: #07111A; --carta: #0E1D2A; --rialzo: #13263A;
  --testo: #E9EDEC; --testo-2: #93A1AB; --linea: #29405A;
  --accento: #E8A867; --accento-tenue: #3A3226; --su-accento: #0E1D2A;
  --ok: #4FB3A5; --no: #D47A70;
  --ombra: 0 6px 24px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .40);
  --sopra: #1A3048; --linea-tenue: #1D3248; --no-testo: #E39A90;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--fondo); color: var(--testo); font: 15px/1.35 var(--f-ui); overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accento); outline-offset: 2px; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--f-mono); font-size: 13px; }
.nome-app { font: 600 23px/1 var(--f-nome); letter-spacing: -.01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* pulsanti */
.bi { border: 0; background: none; color: inherit; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; padding: 0; }
.bi:hover { background: var(--sopra); }
.bi[disabled] { color: var(--linea); cursor: default; background: none; }
.btn { border: 0; background: var(--rialzo); box-shadow: inset 0 0 0 1px var(--linea); border-radius: 14px; min-height: 44px; padding: 0 16px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:hover { background: var(--sopra); }
.btn.primario { background: var(--accento); color: var(--su-accento); box-shadow: none; }
.btn.primario:hover { filter: brightness(1.05); }
.btn.pericolo { background: var(--no); color: #FFFFFF; box-shadow: none; }
.btn.piccolo { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 12px; }
.btn.testo { background: none; box-shadow: none; padding: 0 10px; }
.tondo { border: 0; padding: 0; width: 58px; height: 58px; border-radius: 50%; background: var(--accento); color: var(--su-accento); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(14,29,42,.24); }
.tondo .ic { width: 26px; height: 26px; }

/* fogli, menu, avvisi */
.velo { position: fixed; inset: 0; z-index: 50; background: rgba(14, 29, 42, .32); display: flex; align-items: flex-end; justify-content: center; }
.foglio { background: var(--rialzo); width: 100%; max-height: 88vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 18px 16px calc(16px + var(--area-giu)); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 -8px 30px rgba(14,29,42,.16); transform: translateY(16px); opacity: 0; transition: transform .15s, opacity .15s; }
.velo.su .foglio { transform: none; opacity: 1; }
@media (min-width: 720px) {
  .velo { align-items: center; padding: 24px; }
  .foglio { width: min(460px, 100%); border-radius: 20px; padding: 20px; box-shadow: var(--ombra); }
  .foglio.foglio-menu { width: min(340px, 100%); }
}
.foglio-titolo { margin: 0; font-size: 18px; font-weight: 600; }
.foglio-sotto { margin: -6px 0 0; color: var(--testo-2); font-size: 14px; }
.foglio-azioni { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.foglio-azioni .btn { min-width: 96px; }
.velo-trasparente { position: fixed; inset: 0; z-index: 50; }
.menu { position: fixed; background: var(--rialzo); border-radius: 20px; box-shadow: 0 14px 34px rgba(14,29,42,.18), 0 1px 3px rgba(14,29,42,.10); padding: 6px; max-height: calc(100vh - 16px); overflow: auto; }
.menu-lista { display: flex; flex-direction: column; }
.menu-voce { border: 0; background: none; display: flex; align-items: center; gap: 14px; min-height: 48px; padding: 4px 12px; border-radius: 14px; text-align: left; font-size: 15.5px; }
.menu-voce:hover, .menu-voce:focus-visible { background: var(--sopra); }
.menu-voce.pericolo { color: var(--no-testo); }
.menu-testo { flex: 1; }
.menu-valore { font-family: var(--f-mono); font-size: 12.5px; color: var(--testo-2); }
.menu-sep { height: 1px; background: var(--linea-tenue); margin: 4px 8px; }
.area-avvisi { position: fixed; left: 0; right: 0; bottom: calc(80px + var(--area-giu)); z-index: 60; display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
.avviso { pointer-events: auto; background: var(--testo); color: var(--fondo); border-radius: 14px; min-height: 48px; padding: 6px 8px 6px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--ombra); max-width: 560px; font-size: 14.5px; }
.avviso-azione { border: 0; background: none; color: var(--accento); font-weight: 600; min-height: 40px; padding: 0 10px; border-radius: 10px; }
.avviso:not(:has(.avviso-azione)) { padding-right: 16px; }
.striscia { position: fixed; top: var(--area-su); left: 0; right: 0; z-index: 70; background: var(--no); color: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex-wrap: wrap; font-size: 14px; }
.striscia span { flex: 1; min-width: 200px; }
.striscia .btn { background: #FFFFFF; color: #0E1D2A; box-shadow: none; }
.campo-gruppo { display: flex; flex-direction: column; gap: 6px; margin: 0; }
.campo-etichetta { font-size: 13px; color: var(--testo-2); }
.campo { border: 0; background: var(--fondo); border-radius: 12px; min-height: 48px; padding: 0 14px; font-size: 16px; box-shadow: inset 0 0 0 1px var(--linea); width: 100%; }
.campo:focus { outline: 2px solid var(--accento); outline-offset: 0; }
.campo-errore { margin: 0; color: var(--no-testo); font-size: 13.5px; min-height: 1em; }
.campo-errore:empty { display: none; }
.scelte { display: flex; flex-direction: column; gap: 8px; }
.scelta { border: 0; background: var(--fondo); border-radius: 16px; padding: 10px 14px; min-height: 60px; display: flex; align-items: center; gap: 14px; text-align: left; }
.scelta:hover { background: var(--sopra); }
.scelta-icona { width: 40px; height: 40px; border-radius: 12px; background: var(--rialzo); display: grid; place-items: center; flex: none; }
.scelta-testo { display: flex; flex-direction: column; gap: 2px; }

/* avvio */

.principale { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }

  .griglia { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px 14px; }

.testa-doc .titoli:hover { background: var(--sopra); }

.indicatore { border: 0; height: 36px; padding: 0 12px; flex: none; border-radius: 999px; background: var(--fondo); font-family: var(--f-mono); font-size: 13px; color: var(--testo); font-variant-numeric: tabular-nums; }

.barra-cerca { position: absolute; z-index: 6; top: 12px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 24px)); background: var(--rialzo); border-radius: 18px; box-shadow: var(--ombra); display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 14px; }

@media (max-width: 719.98px) {
  .testa-doc { padding: var(--area-su) 4px 0; gap: 2px; height: calc(52px + var(--area-su)); }

  if (c === undefined || c === s.cartella) return;
  s.cartella = c; await salvaScheda(s); ridisegna();
  avviso(c ? 'Spostato in ' + cartellaViva(c)?.nome : 'Tolto dalla cartella');
}
async function preferito(s) { s.preferito = !s.preferito; await salvaScheda(s); ridisegna(); avviso(s.preferito ? 'Aggiunto ai preferiti' : 'Tolto dai preferiti'); }
async function duplica(s) {
  const base = await leggi('basi', s.id), segni = await segniDi(s.id), mini = await leggi('miniature', s.id);
  const idd = nuovoId(), ora = Date.now();
  const n = { ...s, id: idd, nome: s.nome + ' (copia)', creato: ora, modificato: ora, aperto: ora, pagina: 1, preferito: false, eliminato: null, rimosso: null };
  const op = [{ archivio: 'documenti', valore: n }, { archivio: 'basi', valore: base, chiave: idd }];
  if (mini) op.push({ archivio: 'miniature', valore: mini, chiave: idd });
  for (const x of segni) op.push({ archivio: 'segni', valore: { ...x, doc: idd, chiave: idd + ':' + x.id } });
  await insieme(op);
  L.docs.set(idd, n); emetti('libreria:cambiata', { doc: idd, metadati: true, nuovo: true });
  ridisegna(); avviso('Duplicato: ' + n.nome);
}
async function spostaNelCestino(s, { dopo } = {}) {

async function ripristina(s) {
  s.eliminato = null;

}
async function cancellaContenuto(s) {

  await togliSegniDi(s.id);

async function eliminaPerSempre(s, { chiedi: domanda = true } = {}) {
  if (domanda && !(await conferma('Eliminare per sempre "' + s.nome + '"? Non si può annullare.', { ok: 'Elimina' }))) return false;
  await cancellaContenuto(s);
  s.rimosso = Date.now(); s.conSegni = false;
  await salvaScheda(s); ridisegna();
  return true;
}
async function svuotaCestino() {
  const lista = vivi().length, cest = [...L.docs.values()].filter(d => d.eliminato && !d.rimosso);
  if (!cest.length) { avviso('Il cestino è vuoto.'); return; }
  if (!(await conferma('Eliminare per sempre ' + (cest.length === 1 ? '"' + cest[0].nome + '"' : cest.length + ' documenti') + '? Non si può annullare.', { ok: 'Elimina' }))) return;
  for (const d of cest) await eliminaPerSempre(d, { chiedi: false });

}
// all'avvio: via dal Cestino ciò che c'è da più di 30 giorni; via le lapidi più vecchie di 90 giorni
async function puliziaAvvio() {
  const ora = Date.now();
  for (const d of [...L.docs.values()]) if (d.eliminato && !d.rimosso && ora - d.eliminato > 30 * GIORNO) await eliminaPerSempre(d, { chiedi: false });
  const tenute = new Set(potaLapidi([...L.docs.values()], ora, 90, d => d.rimosso || 0).map(d => d.id));
  const op = [];
  for (const d of [...L.docs.values()]) if (!tenute.has(d.id)) { op.push({ archivio: 'documenti', togli: d.id }, { archivio: 'remoti', togli: d.id }); L.docs.delete(d.id); }
  const cTenute = new Set(potaLapidi([...L.cartelle.values()], ora, 90, c => c.rimosso || c.eliminato || 0).map(c => c.id));
  for (const c of [...L.cartelle.values()]) if (!cTenute.has(c.id)) { op.push({ archivio: 'cartelle', togli: c.id }); L.cartelle.delete(c.id); }
  await insieme(op);
}

// file da dare fuori, con la password se serve
async function fileConPassword(s, password) {
  const segni = await segniDi(s.id);
  if (s.protetto && !password && segni.some(x => !x.eliminato)) {
    password = await chiedi('Questo PDF è protetto', { tipo: 'password', etichetta: 'Password', ok: 'Apri' });
    if (password === null) return null;
  }
  return fileDi(s, { password, segni });
}
function erroreComposizione(s, e, rifai) {
  console.error(e);
  foglio({ titolo: 'plico non riesce a preparare il PDF con i segni', sotto: 'Può succedere con un PDF molto grande su un dispositivo con poca memoria. I segni restano salvati.', azioni: [
    { testo: 'Salva l\'originale', fai: async c => { c(); const b = await leggi('basi', s.id); if (b) { scarica(b, nomePulito(s.nome) + '.pdf'); avviso('Copia salvata'); } } },
    { testo: 'Riprova', primario: true, fai: c => { c(); rifai(); } }
  ] });
}
async function salvaCopia(s, password) {
  let b;
  const attesa = s.peso > 20 * 1048576 ? avviso('Preparo il PDF', { durata: 60000 }) : null;
  try { b = await fileConPassword(s, password); } catch (e) { attesa?.remove(); erroreComposizione(s, e, () => salvaCopia(s, password)); return; }
  attesa?.remove();
  if (!b) return;
  scarica(b, nomePulito(s.nome) + '.pdf'); avviso('Copia salvata');
}
async function condividi(s, password) {
  let b;
  const attesa = s.peso > 20 * 1048576 ? avviso('Preparo il PDF', { durata: 60000 }) : null;
  try { b = await fileConPassword(s, password); } catch (e) { attesa?.remove(); erroreComposizione(s, e, () => condividi(s, password)); return; }
  attesa?.remove();
  if (!b) return;
  const file = new File([b], nomePulito(s.nome) + '.pdf', { type: 'application/pdf' });
  const manda = () => navigator.share({ files: [file], title: s.nome });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await manda(); }
    catch (e) {
      if (e?.name === 'AbortError') return;
      if (e?.name === 'NotAllowedError') { avviso('PDF pronto', { azione: { testo: 'Condividi', fai: () => manda().catch(() => {}) }, durata: 10000 }); return; }
      scarica(file, file.name); avviso('Copia salvata');
    }
  } else { scarica(file, file.name); avviso('Copia salvata'); }
}
